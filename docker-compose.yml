services:

  api:
    build:
      context: .
      dockerfile: Integration.Api/Dockerfile
    ports:
      - "5252:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IntegrationDatabase=Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    depends_on:
      migration:
        condition: service_completed_successfully

  outbox-publisher:
    build:
      context: .
      dockerfile: Integration.OutboxPublisher/Dockerfile
    environment:
      - ConnectionStrings__IntegrationDatabase=Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1 FROM DataIntegrationService.sys.tables' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sqlserver_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Integration.Worker/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  migration:
    build:
      context: .
      dockerfile: Integration.Api/Dockerfile.migrations
    environment:
      - ConnectionStrings__IntegrationDatabase=Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  rabbitmq_data:
  sqlserver_data: