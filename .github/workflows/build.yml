
name: Build and Unit Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
           dotnet-version: |
             8.0.x
             10.0.x

      - name: Restore dependencies
        run: dotnet restore DataIntegrationService.slnx

      - name: Build solution
        id: build
        run: dotnet build DataIntegrationService.slnx --configuration Release --no-restore

      - name: Run Admin unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Tests/Integration.Admin.UnitTests/Integration.Admin.UnitTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=Admin.UnitTests.trx" --results-directory TestResults

      - name: Run API unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Tests/Integration.Api.UnitTests/Integration.Api.UnitTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=Api.UnitTests.trx" --results-directory TestResults

      - name: Run Outbox Publisher unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Tests/Integration.OutboxService.UnitTests/Integration.OutboxPublisher.UnitTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=OutboxPublisher.UnitTests.trx" --results-directory TestResults

      - name: Publish Unit Test Report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          use-actions-summary: true
          report-title: Unit Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
