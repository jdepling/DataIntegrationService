services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "14331:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ../../../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../../../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    tmpfs:
      - /var/lib/rabbitmq:uid=999,gid=999,mode=1770
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migration:
    build:
      context: ../../..
      dockerfile: Integration.Api/Dockerfile.migrations
    environment:
      ConnectionStrings__IntegrationDatabase: "Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  system-b-migration:
    build:
      context: ../../..
      dockerfile: Integration.SystemB/Dockerfile.migrations
    environment:
      ConnectionStrings__SystemBDatabase: "Server=sqlserver,1433;Database=SystemB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
  
  seed-failed-messages:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in {1..60}; do
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P "$$SA_PASSWORD" -C -Q "IF DB_ID('DataIntegrationService') IS NOT NULL AND OBJECT_ID('DataIntegrationService.dbo.FailedMessages') IS NOT NULL SELECT 1" -b >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P "$$SA_PASSWORD" -C -d DataIntegrationService -i /seed/seed-failed-messages.sql -b
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - ./sql/seed-failed-messages.sql:/seed/seed-failed-messages.sql:ro
    depends_on:
      migration:
        condition: service_completed_successfully

  api:
    build:
      context: ../../..
      dockerfile: Integration.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IntegrationDatabase: "Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      migration:
        condition: service_completed_successfully
      seed-failed-messages:
        condition: service_completed_successfully

  outbox-publisher:
    build:
      context: ../../..
      dockerfile: Integration.OutboxPublisher/Dockerfile
    environment:
      ConnectionStrings__IntegrationDatabase: "Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ../../..
      dockerfile: Integration.Worker/Dockerfile
    environment:
      ConnectionStrings__IntegrationDatabase: "Server=sqlserver,1433;Database=DataIntegrationService;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      SystemB__BaseUrl: "http://system-b:8080/"
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      system-b-migration:
        condition: service_completed_successfully

  system-b:
    build:
      context: ../../..
      dockerfile: Integration.SystemB/Dockerfile
    ports:
      - "5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SystemBDatabase: "Server=sqlserver,1433;Database=SystemB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      system-b-migration:
        condition: service_completed_successfully

  admin:
    build:
      context: ../../..
      dockerfile: Integration.Admin/Dockerfile
    ports:
      - "5254:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: "http://api:8080/"
    depends_on:
      api:
        condition: service_started

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4445:4444"
    depends_on:
      admin:
        condition: service_started
